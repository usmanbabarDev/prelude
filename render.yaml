# Render Blueprint: the Prelude app + a free SearXNG search engine (no API key).
# Render asks for the keys marked sync: false when you create the Blueprint. Leave optional ones blank.
services:
  # Free, open-source metasearch (Google, Bing, DuckDuckGo, Brave...). Unreliable: engines may rate-limit it.
  - type: web
    name: prelude-searxng
    runtime: docker
    plan: free
    rootDir: searxng
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8080"
      - key: SEARXNG_SECRET
        generateValue: true

  - type: web
    name: prelude
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Public URL of the SearXNG service above. If Render gives it a different name, update this.
      - key: SEARXNG_URL
        value: https://prelude-searxng.onrender.com
      # Searches per visitor per hour; 0 = unlimited.
      - key: SEARCH_LIMIT_PER_HOUR
        value: "0"
      # Optional: Google results + Google Images via serper.dev (tried first, SearXNG is the fallback)
      - key: SERPER_API_KEY
        sync: false
      # Optional: Exa people index (more LinkedIn profiles with photos)
      - key: EXA_API_KEY
        sync: false
      # Optional: Claude for "Full profile" pages and follow-up chat
      - key: ANTHROPIC_API_KEY
        sync: false
