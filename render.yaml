# Render Blueprint: one web service running server.js.
# Render asks for the keys when you create the Blueprint (sync: false). Leave any optional one blank.
services:
  - type: web
    name: prelude
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Required for real search: Google results + Google Images (serper.dev, 2,500 free searches)
      - key: SERPER_API_KEY
        sync: false
      # Optional: Exa people index (more LinkedIn profiles with photos)
      - key: EXA_API_KEY
        sync: false
      # Optional: Claude for "Full profile" pages and follow-up chat
      - key: ANTHROPIC_API_KEY
        sync: false
