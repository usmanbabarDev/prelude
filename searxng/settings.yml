# Minimal SearXNG config for Prelude. Everything not listed uses SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "Prelude search"

server:
  # Overridden by the SEARXNG_SECRET environment variable (Render generates one).
  secret_key: "change-me"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  # Prelude reads results as JSON.
  formats:
    - html
    - json

outgoing:
  # Don't wait on slow or blocked engines; return whatever arrived.
  request_timeout: 4.0
  max_request_timeout: 6.0

# Spread queries over more engines so one engine blocking us doesn't empty the results.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: google images
    disabled: false
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
